name: Test

on:
    push:
        branches:
            - "master"
            - "develop"
    pull_request:
        types: [ready_for_review, synchronize, opened]

jobs:
    format:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v2
              with:
                  ref: ${{ github.head_ref }}

            - name: Merge Conflict finder
              uses: olivernybroe/action-conflict-finder@v1.1

            - name: Use Java Version 22
              uses: actions/setup-java@v2
              with:
                  distribution: "adopt"
                  java-version: "22"
                  cache: "gradle"

            - name: Format code
              run: gradle format

            - name: Commit fixed code
              uses: stefanzweifel/git-auto-commit-action@v4
              with:
                  commit_message: "style: resolve style guide violations"
                  branch: ${{ github.head_ref }}

    unit:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                java: [21]

        steps:
            - name: Checkout code
              uses: actions/checkout@v2
              with:
                  ref: ${{ github.head_ref }}

            - name: Merge Conflict finder
              uses: olivernybroe/action-conflict-finder@v1.1

            - name: Install Nix
              uses: cachix/install-nix-action@v27

            - name: Install libsecp256k1
              run: |
                nix profile install nixpkgs#secp256k1
              env:
                NIX_PATH: $HOME/.nix-profile/bin

            - name: Set LD_LIBRARY_PATH
              run: echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$HOME/.nix-profile/lib" >> $GITHUB_ENV

            - name: Setup Cache for secp256k1-jdk repo
              uses: actions/cache@v2
              with:
                  path: |
                    ~/secp256k1-jdk
                  key: ${{ runner.os }}-secp256k1-jdk-repo
                  restore-keys: |
                    ${{ runner.os }}-secp256k1-jdk-repo

            - name: Clone secp256k1-jdk if not cached
              run: |
                if [ ! -d "$HOME/secp256k1-jdk" ]; then
                  git clone https://gitlab.com/bitcoinj/secp256k1-jdk.git $HOME/secp256k1-jdk
                fi

            - name: Use Java Version ${{ matrix.java }}
              uses: actions/setup-java@v2
              with:
                  distribution: "adopt"
                  java-version: ${{ matrix.java }}
                  cache: "gradle"

            - name: Set JAVA_HOME
              run: echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV

            - name: Add JAVA_HOME to PATH
              run: echo "$JAVA_HOME/bin" >> $GITHUB_PATH

            - name: Print java version
              run: java -version

            - name: Build secp256k1-jdk
              run: |
                $HOME/secp256k1-jdk/gradlew -p $HOME/secp256k1-jdk build -x test
                cp $HOME/secp256k1-jdk/secp256k1-api/build/libs/secp256k1-api-0.0.1.jar ./libs
                cp $HOME/secp256k1-jdk/secp256k1-foreign/build/libs/secp256k1-foreign-0.0.1.jar ./libs

            - name: Install
              run: gradle dependencies

            - name: Test
              run: gradle test && gradle jacocoTestReport

            - name: Codecov
              run: bash <(curl -s https://codecov.io/bash) -t ${{ secrets.CODECOV_TOKEN }}
